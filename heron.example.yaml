# Heron Agent Checkpoint — Configuration Example
# Copy this file to heron.yaml and fill in your values.
#
# AAP-64 (#33-C): the legacy `--target <url>` HTTP interview-mode was
# removed in 0.5. `heron scan` is MCP-only now (--mcp <config>);
# interactive interviews stay behind the dashboard via `heron serve`
# or `heron` (no args).

# ─── Server mode (Agent → Heron) ───────────────────────────────
# Start with: heron serve  (deprecated — prefer `heron` to open the dashboard)
# server:
#   port: 3700
#   host: 0.0.0.0
#   reportDir: ./reports

# ─── LLM for analysis ──────────────────────────────────────────
llm:
  # LLM used by Heron to analyze agent responses.
  # Options: anthropic, openai, gemini
  #
  # First-time setup: run `heron setup` (or open the dashboard at /setup) —
  # an interactive wizard will ask which provider to use and collect
  # the credentials it needs.
  provider: anthropic

  # API key resolution (in order):
  #   1. --llm-key flag
  #   2. apiKey below
  #   3. HERON_LLM_API_KEY env var
  #   4. ~/.heron/credentials.json (saved by `heron setup`)
  #
  # apiKey: sk-ant-...

  # Optional model override. Defaults track the current flagship
  # per provider — see DEFAULT_MODELS in src/llm/client.ts.
  # model: claude-opus-4-7
  # For OpenAI:  gpt-5.5
  # For Gemini:  gemini-2.5-pro

  # Optional base URL — set this when pointing at an
  # OpenAI-compatible gateway (LiteLLM, OpenRouter, vLLM,
  # Azure-OpenAI proxy). Equivalent to the --llm-base-url CLI flag
  # and the HERON_LLM_BASE_URL env var.
  #   - LiteLLM:    baseURL: https://litellm.example.com
  #   - OpenRouter: baseURL: https://openrouter.ai/api/v1
  # baseURL: https://litellm.example.com

output:
  # Output format: markdown or json
  format: markdown
  # Where to save the report (default: stdout)
  # path: ./reports/audit-report.md
